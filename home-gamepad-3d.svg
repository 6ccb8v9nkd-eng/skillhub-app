      <rect x="171" y="111" width="23" height="75" rx="11.5" fill="url(#yellow2)"/>
      <path d="M154 143H210" stroke="white" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round"/>
      <path d="M177 119V151" stroke="white" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>
    </g>


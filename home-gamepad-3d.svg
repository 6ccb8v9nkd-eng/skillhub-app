    </linearGradient>
    <radialGradient id="yellow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(326 139) rotate(68) scale(31)">
      <stop stop-color="#FFF8B3"/>

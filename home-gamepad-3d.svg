      <circle cx="225" cy="180" r="15" fill="#171B21" stroke="#7861A9" stroke-opacity="0.48" stroke-width="3"/>
      <circle cx="277" cy="180" r="24" fill="#090B0F" stroke="#404752" stroke-width="5"/>
      <circle cx="277" cy="180" r="15" fill="#171B21" stroke="#7861A9" stroke-opacity="0.48" stroke-width="3"/>

      <circle cx="368" cy="144" r="17" fill="url(#yellow)"/>
      <circle cx="338" cy="169" r="17" fill="url(#yellow)"/>
      <circle cx="302" cy="148" r="17" fill="url(#yellow)"/>
      <circle cx="329" cy="117" r="5" fill="#FFFCE0" fill-opacity="0.8"/>
      <circle cx="362" cy="137" r="5" fill="#FFFCE0" fill-opacity="0.72"/>

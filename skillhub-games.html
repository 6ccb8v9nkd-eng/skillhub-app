function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function storeKey(){try{var user=window.parent&&typeof window.parent.shArcadeProfileKey==='function'?window.parent.shArcadeProfileKey():'guest';return KEY+':'+String(user||'guest')}catch(_){return KEY+':guest'}}
function best(){var b={};try{b=JSON.parse(localStorage.getItem(storeKey())||'{}')||{}}catch(_){}
 if(cloudBest)Object.keys(cloudBest).forEach(k=>b[k]=Math.max(Number(b[k]||0),Number(cloudBest[k]||0)));
 return b}
function save(id,n){
 var score=Math.max(0,Math.min(100,Math.round(n))),b=best();b[id]=Math.max(Number(b[id]||0),score);
 try{localStorage.setItem(storeKey(),JSON.stringify(b))}catch(_){}
 if(window.parent!==window&&typeof window.parent.shArcadeProgress==='function'){
  window.parent.shArcadeProgress({action:'save',game:id,score}).then(d=>{
   if(d?.result){if(!cloudBest)cloudBest={};cloudBest[id]=Math.max(Number(cloudBest[id]||0),Number(d.result.best_score||0));if(!cloudPlays)cloudPlays={};cloudPlays[id]=Number(d.result.plays||0)}
  }).catch(()=>{});
 }
}
async function loadCloudProgress(){
 if(cloudLoading||window.parent===window||typeof window.parent.shArcadeProgress!=='function')return;
 cloudLoading=true;
 try{
  var d=await window.parent.shArcadeProgress({action:'list'}),scores={},plays={};
  (d.progress||[]).forEach(x=>{if(x&&games.some(g=>g.id===x.game_id)){scores[x.game_id]=Math.min(100,Math.max(0,Number(x.best_score||0)));plays[x.game_id]=Number(x.plays||0)}});
  cloudBest=scores;cloudPlays=plays;
  if(q('#shgCarousel'))renderZone();
 }catch(_){}finally{cloudLoading=false}
}

function renderZone(){
  cleanup();var p=ensurePage(),b=best(),html='';
  html+='<div class="shg"><div class="shg-top"><button data-close aria-label="Выйти в SkillHub">‹</button><div class="shg-brand">Skill<b>Hub</b></div><button data-info>ⓘ</button></div>';

  games.forEach(function(g){
    html+='<article class="shg-card" data-id="'+g.id+'"><div class="shg-art">'+gameArt(g.id)+'</div><span class="shg-tag">'+(g.level==='Босс'?'♛ ':'')+esc(g.level)+'</span><h2>'+esc(g.title)+'</h2><p>'+esc(g.text)+'</p><div class="shg-mode-actions"><button class="shg-play" data-play="'+g.id+'" '+(g.disabled?'disabled':'')+'>'+(g.disabled?'Скоро':'Аркада ▶')+'</button><button type="button" class="shg-pro" data-pro="'+g.id+'">Полный тренажёр</button></div><div class="shg-best">'+(arcadeBest(g.id)?'Аркада '+arcadeBest(g.id)+'%':'Аркада: первый забег')+(b[g.id]!=null?' · Тренажёр '+b[g.id]+'%':'')+'</div></article>';
  });
  html+='</div><div class="shg-nav"><button data-prev aria-label="Предыдущая игра">‹</button><div class="shg-dots">'+games.map(function(g,i){return '<button data-dot="'+i+'" aria-label="'+esc(g.title)+'"><i class="'+(i===1?'on':'')+'"></i></button>'}).join('')+'</div><button data-next aria-label="Следующая игра">›</button></div></div>';
  p.innerHTML=html;
  p.querySelector('[data-close]').onclick=closeGameZone;
  p.querySelector('[data-info]').onclick=function(){var x=q('#shgInfo');if(x)x.hidden=!x.hidden};
  p.querySelectorAll('[data-play]').forEach(function(x){x.onclick=function(){play(x.dataset.play)}});
   p.querySelectorAll('[data-pro]').forEach(function(x){x.onclick=function(){playPro(x.dataset.pro)}});
  var c=q('#shgCarousel');
  function mark(){
    var cards=[].slice.call(c.children),center=c.scrollLeft+c.clientWidth/2,ix=0,d=1e9;
    cards.forEach(function(x,i){var n=Math.abs(x.getBoundingClientRect().left+x.clientWidth/2-c.getBoundingClientRect().left-c.clientWidth/2);if(n<d){d=n;ix=i}});
    cards.forEach(function(x,i){x.classList.toggle('active',i===ix)});
    p.querySelectorAll('.shg-dots i').forEach(function(x,i){x.classList.toggle('on',i===ix)});
  }
  function jump(i){var t=c.children[Math.max(0,Math.min(games.length-1,i))];if(t)c.scrollTo({left:c.scrollLeft+t.getBoundingClientRect().left-c.getBoundingClientRect().left-(c.clientWidth-t.clientWidth)/2,behavior:'smooth'})}
function active(){return [].slice.call(c.children).findIndex(function(x){return x.classList.contains('active')})}
p.querySelector('[data-prev]').onclick=function(){jump(active()-1)};
p.querySelector('[data-next]').onclick=function(){jump(active()+1)};
p.querySelectorAll('[data-dot]').forEach(function(x){x.onclick=function(){jump(Number(x.dataset.dot))}});
c.addEventListener('scroll',mark,{passive:true});
  requestAnimationFrame(function(){var t=c.querySelector('[data-id=detective]');if(t){c.scrollLeft=t.getBoundingClientRect().left-c.getBoundingClientRect().left+c.scrollLeft-(c.clientWidth-t.clientWidth)/2;mark()}});
}

  var result='<div class="sharc-summary"><div class="sharc-award">🏆</div><div class="sharc-eyebrow">МИССИЯ ЗАВЕРШЕНА</div><div class="sharc-score">'+pct+'<small>%</small></div><h3>'+grade+'</h3><p>Верных решений: '+correct+' из '+rounds.length+' · Лучшее комбо: '+bestStreak+' · Очки: '+points+' XP</p><div class="sharc-record">Личный рекорд аркады: '+previous+'%</div><div class="sharc-result-actions"><button type="button" id="sharcAgain">Играть ещё ▶</button><button type="button" id="sharcPro">Полный тренажёр</button><button type="button" id="sharcHome">К играм</button></div><p class="sharc-disclaimer">Аркадный результат хранится в этом браузере отдельно от оценок ИИ и профессиональных тренажёров.</p></div>';
  p=shell(id,'Результат аркады',result);p.querySelector('.shg-view').classList.add('sharc-view');p.querySelector('.shg-panel').classList.add('sharc-panel');p.querySelector('#sharcAgain').onclick=()=>arcadeRun(id);p.querySelector('#sharcPro').onclick=()=>playPro(id);p.querySelector('#sharcHome').onclick=renderZone;
 }
 function resolve(choice,timeout){
  if(stopped||answering)return;answering=true;stopClock();
  var round=rounds[current],good=choice===round.ok;
  if(good){correct++;streak++;bestStreak=Math.max(streak,bestStreak);speed+=Math.max(0,remaining);var earn=100+streak*25+Math.max(0,remaining)*10;points+=earn}
  else streak=0;
  if(id==='negative'||id==='voice')trust=Math.min(100,Math.max(0,trust+(good?11:-13)));
  p.querySelectorAll('[data-choice]').forEach(b=>{var i=Number(b.dataset.choice);b.disabled=true;b.classList.toggle('correct',i===round.ok);b.classList.toggle('wrong',i===choice&&!good)});
  p.querySelector('#sharcClock').textContent=String(remaining);
  var response=p.querySelector('#sharcResponse');
  response.innerHTML='<div class="sharc-feedback '+(good?'good':'bad')+'"><strong>'+(good?'★ '+(streak>=2?'КОМБО x'+streak:'ТОЧНО В ЦЕЛЬ'):timeout?'ВРЕМЯ ВЫШЛО':'ЕСТЬ ОШИБКА')+'</strong><p>'+esc(round.why)+'</p><button type="button" id="sharcContinue">'+(current+1>=rounds.length?'Результат →':'Дальше →')+'</button></div>';
  p.querySelector('#sharcContinue').onclick=()=>{current++;if(current>=rounds.length)gameOver();else renderRound()};
  p.querySelector('#sharcPoints').textContent=points;p.querySelector('#sharcCombo').textContent=streak;
  p.querySelector('#sharcFooter').textContent=good?'Верное решение! Держи серию.':'Попробуй следующую ситуацию.';
 }
 function renderRound(){
  answering=false;remaining=18;renderHud();var round=rounds[current],opts=p.querySelector('#sharcOptions'),visual=p.querySelector('#sharcCharacter');
  p.querySelector('#sharcResponse').innerHTML='';
  p.querySelector('#sharcQuestion').textContent=round.q;
  p.querySelector('#sharcSubhead').textContent=id==='detective'?'ОПЕРАЦИИ · НАЙДИ НУЖНУЮ':id==='multichat'?'ВХОДЯЩИЕ СООБЩЕНИЯ':id==='negative'?'КЛИЕНТ НА ВЗВОДЕ':'АЛЕКСЕЙ НА ЛИНИИ';
  if(id==='voice')visual.innerHTML='<div class="sharc-client"><div class="sharc-portrait '+(trust<50?'angry':trust>=75?'calm':'doubtful')+'">'+shaAlexeyPortrait(trust<50?'angry':trust>=75?'calm':'doubtful')+'</div><div><b>Алексей</b><small>Настроение: '+(trust<40?'злится':trust<70?'напряжён':'успокаивается')+'</small><div class="sharc-trust"><i style="width:'+trust+'%"></i></div></div></div>';
  else if(id==='negative')visual.innerHTML='<div class="sharc-client"><span class="sharc-boss-icon">😠</span><div><b>Недовольный клиент</b><small>Доверие '+trust+'%</small><div class="sharc-trust"><i style="width:'+trust+'%"></i></div></div></div>';
  else if(id==='multichat')visual.innerHTML='<div class="sharc-chat-queue">'+chatCases.map(x=>'<span class="'+(x.name===round.client?'active':'')+'">'+esc(x.name)+'</span>').join('')+'</div>';
  else visual.innerHTML='<div class="sharc-detective-sign">◈ ОПЕРАЦИОННАЯ ЛЕНТА <span>УЧЕБНЫЕ ДАННЫЕ</span></div>';
  var choices=round.options.map((v,i)=>({v,i})).sort(()=>Math.random()-.5);
  opts.innerHTML=choices.map(x=>'<button type="button" data-choice="'+x.i+'" class="sharc-choice">'+(id==='detective'?'<span class="sharc-op-icon">▤</span><span><strong>'+esc(x.v[0])+'</strong><small>'+esc(x.v[1])+'</small></span><span class="sharc-choice-arrow">›</span>':'<span class="sharc-choice-arrow">›</span><span>'+esc(x.v)+'</span>')+'</button>').join('');
  opts.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>resolve(Number(b.dataset.choice),false));
  var start=Date.now(),duration=18000;endAt=start+duration;
  p.querySelector('#sharcClock').textContent='18';p.querySelector('#sharcTimebar').style.width='100%';
  stopClock();
  timer=setInterval(()=>{if(answering||stopped)return;var left=Math.max(0,endAt-Date.now());remaining=Math.ceil(left/1000);p.querySelector('#sharcClock').textContent=remaining;p.querySelector('#sharcTimebar').style.width=(left/duration*100)+'%';if(left<=0)resolve(-1,true)},100);
 }
 renderRound();
}
function playPro(id){cleanup();if(id==='negative')boss();else if(id==='detective')detective();else if(id==='multichat')multichat();else if(id==='voice')voice()}
function play(id){arcadeRun(id)}



window.shGameCleanup=cleanup;window.addEventListener('pagehide',cleanup);
openGameZone();if(window.parent!==window)window.parent.postMessage({type:'skillhub-games-ready'},location.origin);
})();</script></body></html>

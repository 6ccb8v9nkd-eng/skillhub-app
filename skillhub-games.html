function ensurePage(){return q('#page-games')}
function showPage(){}
function gameHead(g,meta){return '<div class="shg-head"><button data-zone aria-label="Вернуться к играм">‹</button><div><small>'+esc(meta||g.level)+'</small><h2>'+esc(g.title)+'</h2></div></div>'}

function renderZone(){
  cleanup();var p=ensurePage(),b=best(),html='';
  html+='<div class="shg"><div class="shg-top"><button data-close aria-label="Выйти в SkillHub">‹</button><div class="shg-brand">Skill<b>Hub</b></div><button data-info>ⓘ</button></div>';
  html+='<div class="shg-hero"><div class="shg-hero-icon">🎮</div><h1>Игровая зона</h1><p>Прокачивай рабочие навыки в коротких мини-играх. Листай карточки и выбирай свой вызов.</p><p id="shgInfo" hidden>Выбирай игру, проходи задания и улучшай личный результат.</p></div>';
  html+='<div class="shg-carousel" id="shgCarousel">';
  games.forEach(function(g){
    html+='<article class="shg-card" data-id="'+g.id+'"><div class="shg-art">'+gameArt(g.id)+'</div><span class="shg-tag">'+(g.level==='Босс'?'♛ ':'')+esc(g.level)+'</span><h2>'+esc(g.title)+'</h2><p>'+esc(g.text)+'</p><button class="shg-play" data-play="'+g.id+'" '+(g.disabled?'disabled':'')+'>'+(g.disabled?'Скоро':'Играть ▶')+'</button><div class="shg-best">'+(b[g.id]!=null?(g.id==='voice'?'Самооценка ':'Лучший результат ')+b[g.id]+'%':'')+'</div></article>';
  });
  html+='</div><div class="shg-nav"><button data-prev aria-label="Предыдущая игра">‹</button><div class="shg-dots">'+games.map(function(g,i){return '<button data-dot="'+i+'" aria-label="'+esc(g.title)+'"><i class="'+(i===1?'on':'')+'"></i></button>'}).join('')+'</div><button data-next aria-label="Следующая игра">›</button></div></div>';
  p.innerHTML=html;
  p.querySelector('[data-close]').onclick=closeGameZone;
  p.querySelector('[data-info]').onclick=function(){var x=q('#shgInfo');if(x)x.hidden=!x.hidden};
  p.querySelectorAll('[data-play]').forEach(function(x){x.onclick=function(){play(x.dataset.play)}});
  var c=q('#shgCarousel');
  function mark(){
    var cards=[].slice.call(c.children),center=c.scrollLeft+c.clientWidth/2,ix=0,d=1e9;
    cards.forEach(function(x,i){var n=Math.abs(x.getBoundingClientRect().left+x.clientWidth/2-c.getBoundingClientRect().left-c.clientWidth/2);if(n<d){d=n;ix=i}});
    cards.forEach(function(x,i){x.classList.toggle('active',i===ix)});
    p.querySelectorAll('.shg-dots i').forEach(function(x,i){x.classList.toggle('on',i===ix)});
  }
  function jump(i){var t=c.children[Math.max(0,Math.min(games.length-1,i))];if(t)c.scrollTo({left:c.scrollLeft+t.getBoundingClientRect().left-c.getBoundingClientRect().left-(c.clientWidth-t.clientWidth)/2,behavior:'smooth'})}
function active(){return [].slice.call(c.children).findIndex(function(x){return x.classList.contains('active')})}
p.querySelector('[data-prev]').onclick=function(){jump(active()-1)};
p.querySelector('[data-next]').onclick=function(){jump(active()+1)};
p.querySelectorAll('[data-dot]').forEach(function(x){x.onclick=function(){jump(Number(x.dataset.dot))}});
c.addEventListener('scroll',mark,{passive:true});
  requestAnimationFrame(function(){var t=c.querySelector('[data-id=negative]');if(t){c.scrollLeft=t.getBoundingClientRect().left-c.getBoundingClientRect().left+c.scrollLeft-(c.clientWidth-t.clientWidth)/2;mark()}});
}
function openGameZone(){addStyle();if(window.parent!==window)document.body.classList.add('shg-embedded');renderZone()}
function closeGameZone(){cleanup();if(window.parent!==window){try{if(typeof window.parent.shCloseGames==='function'){window.parent.shCloseGames();return}}catch(e){}window.parent.postMessage({type:'skillhub-games-close'},location.origin)}else{location.href='./index.html'}}
window.openGameZone=openGameZone;

function bindZoneBack(){var b=ensurePage().querySelector('[data-zone]');if(b)b.onclick=renderZone}
function finish(id,score,title,msg){
  cleanup();
  save(id,score);var g=games.find(function(x){return x.id===id}),p=ensurePage();
  p.innerHTML='<div class="shg"><div class="shg-view">'+gameHead(g,'Результат')+'<div class="shg-panel shg-result"><div class="shg-score">'+Math.round(score)+'%</div><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="shg-actions"><button class="shg-primary" data-retry>Ещё раз</button><button class="shg-secondary" data-zone>К играм</button></div></div></div></div>';
  p.querySelector('[data-retry]').onclick=function(){play(id)};p.querySelectorAll('[data-zone]').forEach(function(x){x.onclick=renderZone});
}

function shell(id,meta,body){var g=games.find(x=>x.id===id),p=ensurePage();p.innerHTML='<div class="shg"><div class="shg-view">'+gameHead(g,meta)+'<div class="shg-panel">'+body+'</div></div></div>';bindZoneBack();return p}
function shuffle(a){return a.map((v,i)=>({v,i,r:Math.random()})).sort((a,b)=>a.r-b.r)}
function choices(p,items,fn){var el=p.querySelector('.shg-options');el.innerHTML=shuffle(items).map(x=>'<button class="shg-option" data-answer="'+x.i+'">'+esc(x.v)+'</button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.disabled=true);fn(Number(b.dataset.answer))})}
function feedback(p,good,text,next,label){var div=p.querySelector('.shg-feedback-slot');div.innerHTML='<div class="shg-feedback '+(good?'good':'bad')+'"><b>'+(good?'Отличный ход':'Есть над чем поработать')+'</b><div style="margin-top:6px">'+esc(text)+'</div></div><button class="shg-continue">'+esc(label||'Продолжить')+' →</button>';div.querySelector('button').onclick=next}

function draw(){var ch=chats[selected],r=ch.turns[ch.step];p=shell('multichat','Три клиента · 75 секунд','<div class="shg-metrics"><span>Время: <b id="chatTime">'+remaining+' с</b></span><span>Решено: <b>'+chats.filter(x=>x.step===2).length+'/3</b></span></div><div class="shg-tabs">'+chats.map((x,i)=>'<button data-chat="'+i+'" class="'+(selected===i?'active':'')+'">'+esc(x.name)+'<small id="chatWait'+i+'">'+(x.step===2?'✓ Готово':x.ready>0?'Печатает…':'Ждёт '+x.wait+' с')+'</small></button>').join('')+'</div><div class="shg-log">'+ch.history.slice(-4).map(x=>'<p class="'+(x[0]?'mine':'')+'">'+esc(x[1])+'</p>').join('')+'</div>'+(ch.step===2?'<div class="shg-feedback good">Диалог закрыт. Переключись на других клиентов.</div>':ch.ready>0?'<div class="shg-msg">Клиент печатает… Пока можно ответить другому.</div>':'<div class="shg-msg">'+esc(r.q)+'</div><div class="shg-options"></div>')+'<div class="shg-note">За каждые 10 секунд сверх 20 секунд ожидания — штраф 3 п.п. Учебная механика, не норматив банка.</div>');
p.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.chat);draw()});if(r&&ch.ready===0)choices(p,r.a,i=>{var ok=i===r.ok;points+=ok?1:0;answered++;penalty+=Math.floor(Math.max(0,ch.wait-20)/10)*3;ch.history.push([0,r.q],[1,r.a[i]],[0,ok?'✓ Ответ принят':'! Ответ не решил вопрос']);ch.step++;ch.wait=0;ch.ready=ch.step<2?3:0;if(answered===6)complete();else draw()})}
draw();timer=setInterval(()=>{var now=Date.now(),elapsed=Math.floor((now-last)/1000);if(elapsed<1)return;last+=elapsed*1000;remaining=Math.max(0,remaining-elapsed);var changed=false;chats.forEach((ch,i)=>{if(ch.step<2){if(ch.ready>0){var old=ch.ready;ch.ready=Math.max(0,ch.ready-elapsed);ch.wait+=Math.max(0,elapsed-old);if(!ch.ready&&i===selected)changed=true}else ch.wait+=elapsed}var t=p.querySelector('#chatWait'+i);if(t)t.textContent=ch.step===2?'✓ Готово':ch.ready>0?'Печатает…':'Ждёт '+ch.wait+' с'});if(remaining===0)return complete();if(changed)draw();else{var t=p.querySelector('#chatTime');if(t)t.textContent=remaining+' с'}},250)}
var voiceCases=[

function voice(){cleanup();var r=voiceCases[Math.floor(Math.random()*voiceCases.length)],p=shell('voice','Свободный ответ · самопроверка','<h3>Ответь клиенту своими словами</h3><div class="shg-msg">'+esc(r.q)+'</div><div class="shg-voice-actions"><button id="speak">🔊 Прослушать клиента</button><button class="record" id="record">🎙 Записать ответ</button><button id="stop" disabled>■ Остановить запись</button></div><div id="voiceStatus" class="shg-status" role="status">Запись хранится только в этом сеансе. Не называй реальные данные клиентов.</div><audio id="audio" controls hidden></audio><details style="margin:12px 0"><summary>Ответить текстом вместо микрофона</summary><textarea id="voiceText" placeholder="Напиши свой ответ"></textarea></details><button class="shg-continue" id="reveal" disabled>Перейти к самопроверке</button><div id="voiceReview" hidden></div>');var rec=null,stream=null,url=null,dead=false,pending=false,recorded=false,shown=false,timeout=null;var audio=p.querySelector('#audio'),status=p.querySelector('#voiceStatus'),record=p.querySelector('#record'),stop=p.querySelector('#stop'),reveal=p.querySelector('#reveal'),input=p.querySelector('#voiceText');function release(){clearTimeout(timeout);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}activeCleanup=()=>{dead=true;try{if(window.speechSynthesis)window.speechSynthesis.cancel();if(rec&&rec.state!=='inactive')rec.stop()}catch(e){}release();if(url)URL.revokeObjectURL(url)};function ready(){reveal.disabled=!(recorded||input.value.trim().length>=5)}input.oninput=ready;
